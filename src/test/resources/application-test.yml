spring:
  datasource:
    url: jdbc:h2:mem:booking-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long
    expiration-ms: 3600000
  seed:
    enabled: true
