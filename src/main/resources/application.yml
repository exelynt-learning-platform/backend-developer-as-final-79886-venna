spring:
  application:
    name: resource-booking
  datasource:
    url: ${DB_URL:jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    user-username: ${SEED_USER_USERNAME:user}
    user-password: ${SEED_USER_PASSWORD:User123!}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
